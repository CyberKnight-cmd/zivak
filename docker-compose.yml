services:
  neo4j:
    image: neo4j:5
    container_name: zivak-neo4j
    ports:
      - "7474:7474"   # Neo4j browser  →  http://localhost:7474
      - "7687:7687"   # Bolt (driver)  →  bolt://localhost:7687
    environment:
      NEO4J_AUTH: neo4j/zivak_password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p zivak_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: zivak-qdrant
    ports:
      - "6333:6333"   # REST API + Dashboard → http://localhost:6333/dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  neo4j_data:
  qdrant_data: