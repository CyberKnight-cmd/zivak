[project]
name = "zivak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "torch>=2.6.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    # Neo4j and QDrant runtime client + pipeline deps
    "neo4j>=5.28.1",
    "qdrant-client>=1.9.0",
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "pronto>=2.7.3",
    "langchain-groq>=1.1.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
